name: Build & Release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux
            artifact: AulaInicial-linux
          - os: windows-latest
            script: build:win
            artifact: AulaInicial.exe
          - os: macos-latest
            script: build:macos-arm64
            artifact: AulaInicial-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build binary
        run: npm run ${{ matrix.script }}

      - name: Create macOS alias
        if: matrix.os == 'macos-latest'
        run: cp bin/AulaInicial-macos-arm64 bin/AulaInicial-macos

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bin/${{ matrix.artifact }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/AulaInicial-linux/AulaInicial-linux
            artifacts/AulaInicial.exe/AulaInicial.exe
            artifacts/AulaInicial-macos-arm64/AulaInicial-macos-arm64
            artifacts/AulaInicial-macos-arm64/AulaInicial-macos
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
